<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" , initial-scale="1.0" >
        <link rel="stylesheet" href="style.css">
        <title>Personal Finance Manager</title>
    </head>
    <body>
       <header>
        <h1>Personal Finance Manager</h1>
       </header>
       <main>
       <h2>Dashboard</h2>
            <section>
                <h3>Balance Summary</h3>
                <div class="summary-cards">
                    <div class="summary-card">
                        <h4>Total Balance</h4>
                        <p>₹0</p>
                    </div>
                    <div class="summary-card">
                        <h4>Income</h4>
                        <p>₹0</p>
                    </div>
                    <div class="summary-card">
                        <h4>Expenses</h4>
                        <p>₹0</p>
                </div>
                </div>
            </section>

            <section class="transactions-section">
            <h3>Recent Transactions</h3>
                <article class="transaction">
                    <dl>
                        <dt>Merchant</dt>
                        <dd class="merchant">Amazon</dd>
                        <dt>Category</dt>
                        <dd class="category">Shopping</dd>
                        <dt>Amount</dt>
                        <dd class="amount">₹1,200</dd>
                        <dt>Currency</dt>
                        <dd class="currency">INR</dd>
                        <dt>Date</dt>
                        <dd class="date">29 Aug 2026</dd>
                    </dl>
                </article>
            </section>

        </main>
        <footer>
        </footer>   
        <script src="app.js"></script>
    </body>
</html>
